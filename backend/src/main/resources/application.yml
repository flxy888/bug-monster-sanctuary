server:
  address: ${SERVER_ADDRESS:127.0.0.1}
  port: ${SERVER_PORT:8080}
  error:
    include-message: never
spring:
  datasource:
    url: ${DB_URL:jdbc:mysql://127.0.0.1:3306/bug_monster?connectionTimeZone=UTC&forceConnectionTimeZoneToSession=true&useUnicode=true&characterEncoding=UTF-8}
    username: ${DB_USERNAME:bug_monster}
    password: ${DB_PASSWORD:}
    hikari:
      maximum-pool-size: 8
      connection-timeout: 5000
  jackson:
    deserialization:
      fail-on-unknown-properties: true
  sql:
    init:
      mode: never
mybatis:
  configuration:
    map-underscore-to-camel-case: true
sanctuary:
  scan-min-interval-ms: ${SCAN_MIN_INTERVAL_MS:0}
